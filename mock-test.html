<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mock Test | Surya Computer Of Education Center</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><style>.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 4px 18px rgba(0,0,0,.08)}.btn{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;margin:5px}.timer{position:sticky;top:5px;background:#fff;padding:12px;border-radius:8px;font-weight:700;text-align:center;z-index:3}.option{display:block;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.muted{opacity:.7}</style></head><body><div class="top-bar">📞 7084275870 | ✉️ sunilkumar5757@gmail.com</div><header class="header"><img src="assets/images/logo.png" class="logo" alt="Logo"><div class="title"><h1>SURYA COMPUTER OF EDUCATION CENTER</h1><p>Online Mock Test</p></div></header><main class="wrap"><div id="auth" class="card"><h2>🔐 Student Login Required</h2><p>पहले Student Login करें.</p><a href="student-login.html" class="btn">Student Login</a></div><div id="testCard" class="card" style="display:none"><h2>📝 Available Mock Tests</h2><div id="testList">Loading...</div></div><div id="examCard" class="card" style="display:none"><div class="timer" id="timer">Time: --:--</div><h2 id="examTitle"></h2><p id="examInfo"></p><form id="examForm"></form><button class="btn" onclick="submitExam(false)">✅ Submit Test</button><div id="submitMsg"></div></div><div id="resultCard" class="card" style="display:none"><h2>📊 Mock Test Result</h2><div id="result"></div></div><div id="historyCard" class="card" style="display:none"><h2>📚 My Mock Test History</h2><div id="history"></div></div></main><script>
const API="https://script.google.com/macros/s/AKfycbxmKAb9FbNVEEsir5P2wck6Im_Wwm_fPqL0jBMIksLUSd6Dkd8w074STmqESIVBGaCw7A/exec";const token=sessionStorage.getItem('SURYA_STUDENT_TOKEN');let currentTest=null,questions=[],endsAt=0,timerHandle=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,token})});const d=await r.json();if(!d.success)throw new Error(d.message||'Request failed');return d;}
async function init(){if(!token){auth.style.display='block';return;}auth.style.display='none';testCard.style.display='block';historyCard.style.display='block';await loadTests();await loadHistory();const id=new URLSearchParams(location.search).get('test');if(id){const t=(window.__tests||[]).find(x=>String(x['Test ID'])===id);if(t)startTest(t);}}
async function loadTests(){try{const d=await api({action:'publishedMockTests'});window.__tests=d.tests||[];testList.innerHTML=window.__tests.length?window.__tests.map(t=>`<div class="card"><b>${esc(t['Test ID'])}</b> — ${esc(t['Title'])}<br>${esc(t['Course'])} | ${esc(t['Duration'])} minutes | ${esc(t['Total Marks'])} marks<br><span class="muted">${esc(t['Description'])}</span><br><button class="btn" onclick='startTest(${JSON.stringify(t)})'>Start Test</button></div>`).join(''):'No published mock tests.';}catch(e){testList.textContent='❌ '+e.message;}}
async function startTest(t){try{const d=await api({action:'publishedMockQuestions',testId:t['Test ID']});questions=d.questions||[];if(!questions.length)throw new Error('This test has no published questions.');currentTest=t;testCard.style.display='none';examCard.style.display='block';examTitle.textContent=t['Title'];examInfo.textContent=`${t['Course']||''} • ${questions.length} questions • ${t['Duration']} minutes`;examForm.innerHTML=questions.map((q,i)=>`<div class="card"><b>Q${i+1}. ${esc(q['Question'])}</b>${['A','B','C','D'].map(k=>`<label class="option"><input type="radio" name="q${i}" value="${k}"> ${k}. ${esc(q['Option '+k])}</label>`).join('')}</div>`).join('');endsAt=Date.now()+Number(t['Duration']||30)*60000;clearInterval(timerHandle);timerHandle=setInterval(updateTimer,1000);updateTimer();}catch(e){alert('❌ '+e.message);}}
function updateTimer(){const sec=Math.max(0,Math.floor((endsAt-Date.now())/1000)),m=Math.floor(sec/60),s=sec%60;timer.textContent=`Time: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(sec===0){clearInterval(timerHandle);submitExam(true);}}
async function submitExam(auto){if(!currentTest)return;if(!auto&&!confirm('Submit this test now?'))return;const answers=questions.map((q,i)=>document.querySelector(`input[name="q${i}"]:checked`)?.value||'');try{submitMsg.textContent='Submitting...';const d=await api({action:'submitMockTest',testId:currentTest['Test ID'],answers});clearInterval(timerHandle);examCard.style.display='none';resultCard.style.display='block';const r=d.result;result.innerHTML=`<b>Score:</b> ${esc(r.score)} / ${esc(r.totalMarks)}<br><b>Percentage:</b> ${esc(r.percentage)}%<br><b>Grade:</b> ${esc(r.grade)}<br><b>Result:</b> ${esc(r.result)}<hr><p>✅ Correct answers are shown only after submission.</p>${r.review.map((x,i)=>`<div class="card"><b>Q${i+1}. ${esc(x.question)}</b><br>Your answer: ${esc(x.yourAnswer||'Not answered')}<br>Correct answer: <b>${esc(x.correctAnswer)}</b> — ${esc(x.correctText)}<br>Marks: ${esc(x.awarded)}/${esc(x.marks)}</div>`).join('')}`;loadHistory();}catch(e){submitMsg.textContent='❌ '+e.message;}}
async function loadHistory(){try{const d=await api({action:'mockStudentHistory'});const arr=d.attempts||[];history.innerHTML=arr.length?arr.map(a=>`<div class="card"><b>${esc(a['Test Title'])}</b><br>Score: ${esc(a['Score'])}/${esc(a['Total Marks'])} | ${esc(a['Percentage'])}% | Grade ${esc(a['Grade'])} | ${esc(a['Result'])}<br>${esc(a['Submitted At'])}</div>`).join(''):'No attempts yet.';}catch(e){history.textContent='Unable to load history.';}}
init();</script></body></html>
