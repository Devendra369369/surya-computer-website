<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emergency Admin Lock | SURYA</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><style>.emergency-wrap{max-width:520px;margin:60px auto;padding:20px}.emergency-card{padding:28px;border-radius:16px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}.emergency-card input{width:100%;padding:13px;box-sizing:border-box;margin:12px 0;border:1px solid #ccc;border-radius:8px}.danger{background:#8b0000!important;color:#fff!important}</style>    <link rel="stylesheet" href="assets/css/project-ui.css">

    <link rel="stylesheet" href="assets/css/dark-mode-fix.css">
</head><body><main class="emergency-wrap"><section class="emergency-card"><h1>🚨 Emergency Admin Lock</h1><p>This is a separate emergency door. It does not open the Admin Dashboard.</p><p>After successful verification, all Admin login sessions are revoked and new Admin login is blocked for 24 hours. Public services remain active.</p><input id="emergencyPassword" type="password" autocomplete="current-password" placeholder="Emergency password"><button id="lockBtn" class="btn danger" type="button">🔒 Lock Admin for 24 Hours</button><div id="msg" role="status" style="margin-top:15px"></div></section></main><script>const API="https://script.google.com/macros/s/AKfycbxnDVZFqDXbrVXSGHfpn9eRRPTTR8B9RzDjAGE6SyqLxuf_Oq8qZvNloeSIaCwROHsqvw/exec";document.getElementById('lockBtn').onclick=async()=>{const p=document.getElementById('emergencyPassword').value;const m=document.getElementById('msg');if(!p){m.textContent='❌ Enter emergency password.';return;}if(!confirm('Lock Admin login for 24 hours?'))return;m.textContent='⏳ Verifying...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'emergencyLockAdmin',password:p})});const d=await r.json();m.textContent=d.success?'🔒 Admin login locked for 24 hours. Public services remain active.':'❌ '+(d.message||'Lock failed.');}catch(e){m.textContent='❌ Server connection failed.';}};</script>    <script src="assets/js/project-ui.js"></script>
</body></html>
