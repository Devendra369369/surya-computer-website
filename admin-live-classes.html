<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Live Classes Management</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><style>.wrap{max-width:1000px;margin:30px auto;padding:18px}.card{background:#fff;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 4px 18px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.grid input,.grid textarea,.grid select{padding:11px;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}.btn{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;margin:5px}.msg{font-weight:600}</style>    <script src="assets/js/admin-guard.js"></script>
    <link rel="stylesheet" href="assets/css/project-ui.css">

</head><body><main class="wrap"><h2>🔴 Live Classes Management</h2><div class="card"><div class="grid"><input id="id" placeholder="Class ID (blank = auto)"><input id="title" placeholder="Class title"><input id="course" placeholder="Course (blank = all)"><input id="teacher" placeholder="Teacher"><input id="date" placeholder="Date"><input id="start" placeholder="Start time"><input id="end" placeholder="End time"><input id="url" placeholder="Join URL"><textarea id="desc" placeholder="Description"></textarea><select id="status"><option>Draft</option><option>Published</option></select></div><button class="btn" onclick="save()">💾 Save</button><div id="msg" class="msg"></div></div><div id="list"></div></main><script>const API="https://script.google.com/macros/s/AKfycbziAiwAq8nTE-65FVdy8LbmQFBbLVoeukklrOK4uFAgNKZyyjY5bMBJSuOPTBgY5bVufw/exec",token=sessionStorage.getItem('SURYA_ADMIN_TOKEN'),auth=sessionStorage.getItem('SURYA_ADMIN_AUTH');if(auth!=='true'||!token)location.replace('admin-login.html');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,token})});const d=await r.json();if(!d.success)throw new Error(d.message);return d;}async function save(){try{await api({action:'liveSave',class:{classId:id.value,title:title.value,course:course.value,teacher:teacher.value,date:date.value,startTime:start.value,endTime:end.value,joinUrl:url.value,description:desc.value,status:status.value}});msg.textContent='✅ Saved';load();}catch(e){msg.textContent='❌ '+e.message;}}async function load(){try{const d=await api({action:'liveAdminList'});list.innerHTML=(d.classes||[]).map(c=>`<div class="card"><b>${esc(c['Class ID'])}</b> — ${esc(c.Title)} | ${esc(c.Course)} | ${esc(c.Status)}<br>${esc(c.Date)} ${esc(c['Start Time'])}-${esc(c['End Time'])}<br><button class="btn" onclick='edit(${JSON.stringify(c)})'>Edit</button><button class="btn" onclick='del("${esc(c['Class ID'])}")'>Delete</button></div>`).join('')||'No classes.';}catch(e){msg.textContent='❌ '+e.message;}}function edit(c){id.value=c['Class ID'];title.value=c.Title;course.value=c.Course;teacher.value=c.Teacher;date.value=c.Date;start.value=c['Start Time'];end.value=c['End Time'];url.value=c['Join URL'];desc.value=c.Description;status.value=c.Status;}async function del(x){if(!confirm('Delete class?'))return;try{await api({action:'liveDelete',classId:x});load();}catch(e){msg.textContent='❌ '+e.message;}}load();</script>    <script src="assets/js/project-ui.js"></script>
</body></html>
