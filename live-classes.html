<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Live Classes | Surya Computer Of Education Center</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><style>.wrap{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 4px 18px rgba(0,0,0,.08)}.btn{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;background:#1769aa;color:#fff}</style>    <link rel="stylesheet" href="assets/css/project-ui.css">

    <link rel="stylesheet" href="assets/css/dark-mode-fix.css">
</head><body><div class="top-bar">📞 7084275870 | ✉️ sunilkumar5757kp@gmail.com</div><header class="header"><img src="assets/images/logo.png" class="logo" alt="Logo"><div class="title"><h1>SURYA COMPUTER OF EDUCATION CENTER</h1><p>Live Classes</p></div></header><main class="wrap"><h2>🔴 Live / Upcoming Classes</h2><div id="msg">Loading...</div><div id="classes"></div></main><script>const API="https://script.google.com/macros/s/AKfycbwSNgtaUsInP4pOPORHVcYjyFKIqESpTj_zyLqy-4dpLUMX--D1EnRv36YVbGwfkL7l/exec",token=sessionStorage.getItem('SURYA_STUDENT_TOKEN');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}async function load(){if(!token){msg.textContent='❌ Student login required.';return;}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'liveClasses',token})});const d=await r.json();if(!d.success)throw new Error(d.message);const a=d.classes||[];msg.textContent=a.length?'':'No published classes.';classes.innerHTML=a.map(c=>`<div class="card"><h3>${esc(c['Title'])}</h3><p><b>Course:</b> ${esc(c['Course'])}</p><p><b>Teacher:</b> ${esc(c['Teacher'])}</p><p><b>Date:</b> ${esc(c['Date'])} | ${esc(c['Start Time'])} - ${esc(c['End Time'])}</p><p>${esc(c['Description'])}</p>${c['Join URL']?`<a class="btn" href="${esc(c['Join URL'])}" target="_blank" rel="noopener">🎥 Join Class</a>`:''}</div>`).join('');}catch(e){msg.textContent='❌ '+e.message;}}load();</script>    <script src="assets/js/project-ui.js"></script>
</body></html>
