    <meta charset="UTF-8">

</head>

<body>

<div class="top-bar">
    📞 7084275870 |

<header class="header">

    <img src="assets/images/logo.png" alt="Logo" class="logo">

    <div class="title">
        <h1>SURYA COMPUTER OF EDUCATION CENTER</h1>

</header>


<nav class="navbar">

    <a href="index.html">Home</a>
    <a href="about.html">About</a>

<section class="admin-login">

    <div class="admin-login-card">

        <div class="admin-login-icon">
            🔐
        </div>

        <h2>Admin Login</h2>

        <p>
            Authorized personnel only
        </p>


        <form id="adminLoginForm">

            <input
                type="text"
                id="adminUsername"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Admin Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <div id="adminLoginMessage"></div>

    </div>

</section>


<footer class="footer">

    <div class="footer-content">

        <h2>SURYA COMPUTER OF EDUCATION CENTER</h2>

        <p>
            Kamalpur, Chandauli, Uttar Pradesh
        </p>

        <p>
            📞 +91 7084275870
        </p>

        <p>
            © 2026 SURYA COMPUTER OF EDUCATION CENTER
        </p>

    </div>

</footer>


<script>

const SURYA_DATABASE_API =
    "https://script.google.com/macros/s/AKfycbxWG_ick4oYevNkOACXY-A-DurFLbXyDjurvNyOaORXJ1mpx8Bs41xvdJbd867Hcy3PDg/exec";


const adminLoginForm =
    document.getElementById("adminLoginForm");

const adminLoginMessage =
    document.getElementById("adminLoginMessage");


adminLoginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("adminUsername")
                .value
                .trim();


        const password =
            document
                .getElementById("adminPassword")
                .value
                .trim();


        adminLoginMessage.innerHTML =
            "⏳ Authenticating...";


        try {

            const response =
                await fetch(
                    SURYA_DATABASE_API,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify({

                                action:
                                    "adminLogin",

                                username:
                                    username,

                                password:
                                    password

                            })
                    }
                );


            const result =
                await response.json();


            if (
                result.success &&
                result.token
            ) {

                sessionStorage.setItem(
                    "SURYA_ADMIN_TOKEN",
                    result.token
                );


                sessionStorage.setItem(
                    "SURYA_ADMIN_AUTH",
                    "true"
                );


                window.location.href =
                    "admin.html";


            } else {

                adminLoginMessage.innerHTML = `
                    <div class="login-error">
                        ❌ ${result.message || "Invalid login"}
                    </div>
                `;

            }

        }

        catch (error) {

            console.error(
                "ADMIN LOGIN ERROR:",
                error
            );


            adminLoginMessage.innerHTML = `
                <div class="login-error">
                    ❌ Server connection failed.
                    <br>
                    <small>
                        Please try again.
                    </small>
                </div>
            `;

        }

    }

);

</script>


</body>
</html>
